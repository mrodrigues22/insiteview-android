# Android CI (docs/PLAN.md §4). The JVM modules' tests, then every Android module: build,
# unit tests and lint, plus an unsigned release build (R8 shrinking catches missing keep rules).
# Runs on every push so Claude Code sessions (which can't reach Google's Maven) see the Android
# build here.
name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: JVM module tests (core, modelkit, api)
        run: ./gradlew :core:test :modelkit:test :api:test --continue

      - name: Android build, unit tests and lint
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug :app:assembleRelease --continue 2>&1 | tee build.log

      # A short list at the end of the log: compiler errors, failed tasks and tests.
      - name: Error summary
        if: failure()
        run: |
          grep -E "^e: |^w: .*(deprecated|unchecked)|> Task .* FAILED|FAILED$|What went wrong|Lint found|: Error: |tests completed" build.log | sed 's#file:///home/runner/work/insiteview-android/insiteview-android/##' | head -150 || true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
