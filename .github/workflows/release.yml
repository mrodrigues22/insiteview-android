# Release (docs/PLAN.md §5, AND-M6-04): a signed app bundle from a `v*` tag (or by hand), kept as an
# artifact and, when Play credentials are set, uploaded to a Google Play track.
#
# Repository secrets:
#   IV_UPLOAD_KEYSTORE_BASE64   the upload keystore (.jks), base64
#   IV_UPLOAD_KEYSTORE_PASSWORD, IV_UPLOAD_KEY_ALIAS, IV_UPLOAD_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   optional: a Play Console service account (Release manager) as JSON
# The first bundle of a new app must be uploaded by hand in Play Console; later ones can go here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track (when PLAY_SERVICE_ACCOUNT_JSON is set)
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.IV_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        run: |
          # versionName: the tag without its "v" (v1.2.0 → 1.2.0), or 0.0.0-<sha> by hand.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; else name="0.0.0-${GITHUB_SHA::7}"; fi
          # versionCode: grows with every run; the offset keeps room below for hand-made builds.
          echo "IV_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "IV_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.IV_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "IV_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: No keystore
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::IV_UPLOAD_KEYSTORE_BASE64 isn't set; the bundle is unsigned and can't go to Google Play."

      - name: Build
        env:
          IV_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.IV_UPLOAD_KEYSTORE_PASSWORD }}
          IV_UPLOAD_KEY_ALIAS: ${{ secrets.IV_UPLOAD_KEY_ALIAS }}
          IV_UPLOAD_KEY_PASSWORD: ${{ secrets.IV_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :core:test :modelkit:test :api:test testReleaseUnitTest :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: insiteview-android-${{ env.IV_VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.getinsiteview.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: completed
