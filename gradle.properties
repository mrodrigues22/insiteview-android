org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 builds Kotlin itself by default. The Kotlin Gradle plugin is kept instead (and with it
# the old DSL): the JVM modules apply it too, and one plugin for every module is simpler.
android.builtInKotlin=false
android.newDsl=false
# `-PjvmOnly=true` (or IV_JVM_ONLY=1) builds :core, :modelkit and :api only, without AGP:
# Google's Maven is unreachable from the Claude Code session proxy (CLAUDE.md).
jvmOnly=false
