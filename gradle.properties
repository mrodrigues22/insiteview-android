org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Android modules use AGP 9's built-in Kotlin (no org.jetbrains.kotlin.android); the Kotlin
# Gradle plugin on the root classpath sets its version and builds the JVM modules.
# `-PjvmOnly=true` (or IV_JVM_ONLY=1) builds :core, :modelkit and :api only, without AGP:
# Google's Maven is unreachable from the Claude Code session proxy (CLAUDE.md).
jvmOnly=false
